name: Test

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['README.md', 'docs/**']
  pull_request:
    branches: [main]
    paths-ignore: ['README.md', 'docs/**']

permissions:
  contents: read

concurrency:
  group: sdk-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build

      - run: npm run build:langchain
      - name: Test Apify Sanctions Actor (offline, no credentials)
        run: npm test --prefix actors/sanctions
      - name: Test three paid Apify product wrappers (offline, no credentials)
        run: npm test --prefix actors/paid-runtime
