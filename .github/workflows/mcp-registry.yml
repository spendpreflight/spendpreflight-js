name: Publish remote MCP listing

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcp-registry-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'spendpreflight/spendpreflight-js'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Install official MCP publisher
        run: |
          curl --fail --location --silent --show-error --output mcp-publisher.tar.gz https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz
          echo 'a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  mcp-publisher.tar.gz' | sha256sum --check
          tar -xzf mcp-publisher.tar.gz mcp-publisher
      - name: Validate remote manifest
        run: ./mcp-publisher validate .mcp/server.json
      - name: Authenticate through GitHub OIDC
        run: ./mcp-publisher login github-oidc
      - name: Publish operated remote service
        run: ./mcp-publisher publish .mcp/server.json
